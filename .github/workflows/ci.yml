name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Kernlogica (swift test)
    runs-on: ubuntu-latest
    # The runner images do not all ship Swift; the official image always does.
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - name: Test HikeCore
        working-directory: HikeCore
        run: |
          swift --version
          swift test

  app:
    name: iOS-app (xcodebuild test)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Pick an iPhone simulator
        run: |
          xcodebuild -version
          # The last iPhone of the newest installed iOS runtime.
          LINE=$(xcrun simctl list devices available | grep -E '^ +iPhone' | grep -v ' SE ' | tail -1)
          echo "Simulator: $LINE"
          UDID=$(echo "$LINE" | grep -oE '[0-9A-F]{8}-[0-9A-F-]{27}')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
      - name: Build and run unit and UI tests
        run: |
          # Record the simulator's screen while the tests drive the app: the UI test doubles
          # as a walkthrough of the app.
          xcrun simctl boot "$SIMULATOR_UDID" || true
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          mkdir -p video
          xcrun simctl io "$SIMULATOR_UDID" recordVideo --codec=h264 --force video/walkthrough.mp4 &
          RECORDER=$!
          set +e
          xcodebuild test \
            -project Hike.xcodeproj \
            -scheme Hike \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -resultBundlePath TestResults.xcresult \
            -quiet
          STATUS=$?
          kill -INT "$RECORDER"
          wait "$RECORDER"
          ls -la video
          exit $STATUS
      - name: Show why tests failed
        if: failure()
        run: xcrun xcresulttool get test-results summary --path TestResults.xcresult
      - name: Export screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
          ls -la screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn
      - name: Upload walkthrough video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: walkthrough
          path: video
          if-no-files-found: warn
